  accent: "#C3A96A"       # CBS Gold (accents only, never text on light)
  accent_text: "#8A6F2E"  # Dark Gold (gold-coloured text on white)
  light: "#F4F6F9"
  muted: "#5B6B80"        # Slate
  font_display: "Montserrat"
  font_body: "Source Sans 3"
  logo: /assets/img/cbs-logo-horizontal.svg
  logo_reversed: /assets/img/cbs-logo-horizontal-reversed.svg
  share_image: /assets/img/social-share.jpg

